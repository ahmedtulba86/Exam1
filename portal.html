<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة متابعة الدرجات</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--pri:#1e40af;--ok:#16a34a;--mid:#d97706;--low:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e5e7eb;--mute:#94a3b8;--line:#25314a;--pri:#60a5fa;--ok:#4ade80;--mid:#fbbf24;--low:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 10px}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:13px;margin:10px 0 4px;color:var(--mute)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);direction:ltr;text-align:right}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line);margin-top:0;width:auto;padding:6px 12px;font-size:13px}
.msg{margin-top:10px;font-size:14px;color:var(--low)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0}
.row .n b{display:block;overflow-wrap:anywhere}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;right:0;top:0;bottom:0;border-radius:99px}
.sc{text-align:center;min-width:64px;font-weight:700}
.sc small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.hidden{display:none}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="wrap">

<div id="loginView">
  <div class="card">
    <h1>متابعة الدرجات</h1>
    <div class="mute">ادخل برقم تليفون الطالب والكود السري اللي وصلك من المعلم.</div>
    <form id="f" autocomplete="off">
      <label for="ph">رقم تليفون الطالب</label>
      <input id="ph" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx" required>
      <label for="cd">الكود السري</label>
      <input id="cd" type="password" inputmode="numeric" autocomplete="off" required>
      <button type="submit" id="go">دخول</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>
</div>

<div id="dataView" class="hidden"></div>

</div>

<script>
(function(){
var SB_URL='https://nmcmhlqstkfhsvnyeeod.supabase.co';
var SB_KEY='sb_publishable_n_zipcibBGa0RbW6xMloFw_S5Zt0qqH';
var cred=null;

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function digits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/\D/g,'');}
function color(p){return p>=85?'var(--ok)':p>=50?'var(--mid)':'var(--low)';}
function label(p){return p>=85?'ممتاز':p>=70?'جيد جدًا':p>=50?'ناجح':'يحتاج دعم';}
function num(v){return Math.round(v*10)/10;}

function load(){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},15000);
  return fetch(SB_URL+'/rest/v1/rpc/portal_get',{method:'POST',signal:ctl.signal,
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_phone:cred.p,p_code:cred.c})
  }).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('تعذر الاتصال بالخادم');return r.json();});
}

function chart(list){
  var pts=list.filter(function(e){return e.pct!==null;});
  if(pts.length<2)return '';
  var W=520,H=190,pl=30,pr=14,pt=14,pb=30,iw=W-pl-pr,ih=H-pt-pb,n=pts.length;
  function x(i){return W-pr-(n===1?0:i*iw/(n-1));}  // RTL: oldest on the right
  function y(v){return pt+ih-(Math.max(0,Math.min(100,v))/100*ih);}
  var grid=[0,25,50,75,100].map(function(v){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" '+(v%50?'stroke-dasharray="3 3"':'')+'/><text x="'+(pl-5)+'" y="'+(y(v)+4)+'" font-size="10" text-anchor="end" fill="var(--mute)">'+v+'</text>';}).join('');
  var path=pts.map(function(e,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(e.pct).toFixed(1);}).join(' ');
  var gp=pts.filter(function(e){return e.groupAvg!=null;});
  var gpath=gp.length>=2?pts.map(function(e,i){return e.groupAvg==null?null:{x:x(i),y:y(e.groupAvg)};}).filter(Boolean).map(function(q,i){return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1);}).join(' '):'';
  var every=n>8?Math.ceil(n/8):1;
  var xl=pts.map(function(e,i){return (i%every===0||i===n-1)?'<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+(i+1)+'</text>':'';}).join('');
  var dots=pts.map(function(e,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(e.pct).toFixed(1)+'" r="4.5" fill="var(--card)" stroke="'+color(e.pct)+'" stroke-width="3"><title>'+esc(e.name)+': '+num(e.pct)+'%'+(e.groupAvg!=null?' (المجموعة '+num(e.groupAvg)+'%)':'')+'</title></circle>';}).join('');
  var legend='<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px"><span><b style="color:var(--pri)">━</b> الطالب</span>'+(gpath?'<span><b>┅</b> متوسط المجموعة</span>':'')+'<span>الأرقام أسفل الرسم = ترتيب الاختبار</span></div>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="تطور مستوى الطالب مقارنة بالمجموعة">'+grid+(gpath?'<path d="'+gpath+'" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>':'')+'<path d="'+path+'" fill="none" stroke="var(--pri)" stroke-width="2.8" stroke-linejoin="round"/>'+dots+xl+'</svg>'+legend;
}

function topicsCard(tp){
  tp=(tp||[]).filter(function(t){return t.total>=2;});
  if(!tp.length)return '';
  var weak=tp.filter(function(t){return t.pct<70;}).slice(0,3);
  var strong=tp.slice().sort(function(a,b){return b.pct-a.pct;}).filter(function(t){return t.pct>=70;}).slice(0,3);
  function line(t){
    var diff=t.groupPct!=null?t.pct-t.groupPct:null;
    return '<div class="row"><div class="n"><b>'+esc(t.name)+'</b><div class="bar"><i style="width:'+Math.max(2,t.pct)+'%;background:'+color(t.pct)+'"></i>'+(t.groupPct!=null?'<u style="position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);right:'+Math.min(98,t.groupPct)+'%" title="متوسط المجموعة"></u>':'')+'</div>'+
      '<div class="mute" style="font-size:12px;margin-top:4px">'+t.correct+' صح من '+t.total+(diff!==null?' · '+(diff>=3?'أعلى من المجموعة':diff<=-3?'أقل من المجموعة':'قريب من المجموعة'):'')+'</div></div><div class="sc" style="color:'+color(t.pct)+'">'+num(t.pct)+'%</div></div>';
  }
  var h='<div class="card"><h2>نقاط القوة والضعف</h2>';
  if(weak.length)h+='<div style="font-weight:700;color:var(--low);margin:4px 0">يحتاج تركيز</div>'+weak.map(line).join('');
  if(strong.length)h+='<div style="font-weight:700;color:var(--ok);margin:12px 0 4px">نقاط القوة</div>'+strong.map(line).join('');
  if(!weak.length&&!strong.length)h+=tp.map(line).join('');
  h+='<div class="mute" style="margin-top:10px">الخط الأسود على الشريط = متوسط المجموعة. محسوبة من أسئلة الاختبارات الإلكترونية.</div></div>';
  return h;
}

function render(d){
  var o=d.overall||{},ex=d.exams||[];
  var done=ex.filter(function(e){return e.score!==null;});
  var pending=ex.filter(function(e){return e.score===null;});
  var pct=o.pct;
  var series=done.map(function(e){return e.pct;});
  var trend=series.length>=2?series[series.length-1]-series[0]:null;
  var h='<div class="card"><div class="top"><div><h1>'+esc(d.name)+'</h1><div class="mute">'+esc(d.group||'')+'</div></div><button class="ghost" id="out">خروج</button></div>';
  if(pct!==null&&pct!==undefined){
    h+='<div style="margin-top:10px"><span class="pill" style="background:'+color(pct)+';color:#fff">'+label(pct)+'</span></div>';
    h+='<div class="kpis"><div class="kpi"><b style="color:'+color(pct)+'">'+num(pct)+'%</b><span>المستوى العام</span></div>'+
       '<div class="kpi"><b>'+(o.rank?'<bdi dir="ltr">'+o.rank+' / '+o.groupSize+'</bdi>':'—')+'</b><span>الترتيب في المجموعة</span></div>'+
       '<div class="kpi"><b>'+(o.groupAvg!=null?num(o.groupAvg)+'%':'—')+'</b><span>متوسط المجموعة</span></div></div>';
    if(o.groupAvg!=null){var gd=pct-o.groupAvg;h+='<div class="mute" style="margin-top:10px">'+(gd>=3?'▲ أعلى من متوسط المجموعة بـ '+num(gd)+'%':gd<=-3?'▼ أقل من متوسط المجموعة بـ '+num(Math.abs(gd))+'%':'قريب من متوسط المجموعة')+'</div>';}
    if(trend!==null){h+='<div class="mute" style="margin-top:10px">'+(trend>=3?'▲ مستوى في تحسن بين أول وآخر اختبار بمقدار '+num(trend)+'%':trend<=-3?'▼ مستوى في تراجع بين أول وآخر اختبار بمقدار '+num(Math.abs(trend))+'%':'مستوى مستقر بين أول وآخر اختبار')+'</div>';}
  }else{h+='<div class="mute" style="margin-top:10px">لا توجد درجات مسجلة حتى الآن.</div>';}
  h+='</div>';
  var c=chart(ex);
  if(c)h+='<div class="card"><h2>تطور المستوى</h2>'+c+'</div>';
  h+=topicsCard(d.topics);
  if(ex.length){
    h+='<div class="card"><h2>الاختبارات ('+done.length+' من '+ex.length+')</h2>';
    ex.slice().reverse().forEach(function(e){
      if(e.score===null)return;
      h+='<div class="row"><div class="n"><b>'+esc(e.name)+'</b><div class="bar"><i style="width:'+Math.max(2,Math.min(100,e.pct))+'%;background:'+color(e.pct)+'"></i></div>'+(e.groupAvg!=null?'<div class="mute" style="font-size:12px;margin-top:4px">متوسط المجموعة '+num(e.groupAvg)+'% '+(e.pct-e.groupAvg>=3?'<span style="color:var(--ok)">▲ أعلى</span>':e.pct-e.groupAvg<=-3?'<span style="color:var(--low)">▼ أقل</span>':'')+'</div>':'')+'</div>'+
         '<div class="sc" style="color:'+color(e.pct)+'">'+'<bdi dir="ltr">'+num(e.score)+' / '+num(e.max)+'</bdi>'+'<small>'+num(e.pct)+'%</small></div></div>';
    });
    if(pending.length){h+='<div class="mute" style="margin-top:10px">لم تُسجَّل له درجة في: '+pending.map(function(e){return esc(e.name);}).join('، ')+'</div>';}
    h+='</div>';
  }
  h+='<div class="mute" style="text-align:center;margin:8px 0 20px">آخر تحديث: '+(d.updated?new Date(d.updated).toLocaleString('ar-EG'):'—')+'</div>';
  $('dataView').innerHTML=h;
  $('out').onclick=function(){cred=null;try{sessionStorage.removeItem('pc');}catch(e){}$('dataView').classList.add('hidden');$('loginView').classList.remove('hidden');$('cd').value='';};
}

function enter(){
  $('go').disabled=true;$('msg').textContent='';
  load().then(function(d){
    $('go').disabled=false;
    if(!d||d.error){$('msg').textContent=(d&&d.error)||'تعذر تحميل البيانات';cred=null;try{sessionStorage.removeItem('pc');}catch(e){}return;}
    try{sessionStorage.setItem('pc',JSON.stringify(cred));}catch(e){}
    $('loginView').classList.add('hidden');$('dataView').classList.remove('hidden');
    render(d);
  }).catch(function(e){$('go').disabled=false;$('msg').textContent=e&&e.name==='AbortError'?'انتهت المهلة، تأكد من الإنترنت':(e&&e.message)||'حدث خطأ';});
}
$('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  cred={p:digits($('ph').value),c:String($('cd').value).trim()};
  if(!cred.p||!cred.c){$('msg').textContent='اكتب الرقم والكود';return;}
  enter();
});
try{var sv=JSON.parse(sessionStorage.getItem('pc')||'null');if(sv&&sv.p&&sv.c){cred=sv;enter();}}catch(e){}
})();
</script>
</body>
</html>
