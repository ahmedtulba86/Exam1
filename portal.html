<script>

var L={a:'أ',b:'ب',c:'ج',d:'د'},S={me:null,d:null,tab:'new',rev:{},tm:null},$=function(i){return document.getElementById(i)};

/* ---------- دخول ---------- */
function loginView(msg){
  $('app').innerHTML='<div class="card" style="margin-top:8vh"><div style="text-align:center;font-size:42px">🎓</div><h2 style="text-align:center;color:var(--p)">عصير الكتب — بوابة الطالب</h2>'+
  '<label>الاسم أو رقم التليفون</label><input id="lid" autocomplete="username" placeholder="اكتب اسمك الثلاثي أو رقم تليفونك">'+

    return digits.length>=7?{phone:digits,code:code}:{error:'الدخول بالاسم يحتاج تشغيل ملف portal_setup.sql مرة واحدة'};
  }).then(function(r){
    if(r.error){$('lerr').textContent=r.error;$('lgo').disabled=false;return}

    S.d=d;S.me.name=d.name||S.me.name;S.rev={};S.W=null;S.vd=null;flush();
    S.vdTry=0;return Promise.all([rpc('portal_old',{p_phone:S.me.phone,p_code:S.me.code}).then(function(o){S.old=(Array.isArray(o)?o:[]).map(function(x){return {exam_id:'old:'+x.pub_id,title:x.title,score:+x.score||0,total:+x.total||0,at:x.at,review:!!x.review,old:1}})}).catch(function(){S.old=[]}),rpc('portal_stats',{p_phone:S.me.phone,p_code:S.me.code}).then(function(s){S.st={};(Array.isArray(s)?s:[]).forEach(function(x){S.st[x.exam_id]=x})}).catch(function(){S.st={}}),rpc('portal_notes',{p_phone:S.me.phone,p_code:S.me.code}).then(function(n){S.nt={};(Array.isArray(n)?n:[]).forEach(function(x){S.nt[x.exam_id]=x.note})}).catch(function(){S.nt={}})]);
  }).then(function(){home()});
}
function logout(){sv('pt_me',null);S.me=S.d=null;loginView()}

/* ---------- الرئيسية ---------- */

function home(){
  clearInterval(S.tm);
  var av=avail(),seen=ld('pt_seen')||[],nw=av.filter(function(e){return seen.indexOf(e.id)<0}),nbg=newBadges();
  $('app').innerHTML=(pushOK()&&!ld('pt_push')&&Notification.permission!=='denied'?'<div class="nb" onclick="pushOn()"><span>🔔 فعّل التنبيهات عشان يوصلك أي اختبار أو فيديو جديد</span><span>تفعيل</span></div>':'')+'<div class="top card"><div><b>أهلاً '+esc(S.me.name||'')+' 👋</b><div class="m">بوابة الطالب</div></div><button class="g" onclick="logout()">خروج</button></div>'+
  (nbg.length?'<div class="nb" style="background:#dcfce7;border-color:#86efac" onclick="tab(\'old\')"><span>🎉 شارة جديدة: '+nbg.map(function(b){return b.i+' '+b.n}).join('، ')+'</span><span>شوفها ←</span></div>':'')+(nw.length&&S.tab!=='new'?'<div class="nb" onclick="tab(\'new\')"><span>🔔 '+(nw.length>1?nw.length+' اختبارات جديدة متاحة':'اختبار جديد: '+esc(nw[0].title))+'</span><span>افتح ←</span></div>':'')+'<div class="tabs">'+[['new','🆕 الاختبارات الجديدة'+(av.length?' <span class="dot">'+av.length+'</span>':'')],['old','📊 اختباراتي القديمة'],['err','❌ أخطائي'],['vid','🎬 الفيديوهات']].map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div><div id="body"></div>';
  ({new:tNew,old:tOld,err:tErr,vid:tVid})[S.tab]();
}
function tab(t){S.tab=t;home()}

/* ---------- 1) الاختبارات الجديدة ---------- */
function tNew(){
  var now=Date.parse(S.d.now)||Date.now(),list=avail();

    var soon=e.opens_at&&Date.parse(e.opens_at)>now;
    return '<div class="card"><div class="row"><div><b>'+esc(e.title)+'</b><div class="m">'+e.count+' سؤال · '+e.duration_min+' دقيقة · محاولات: '+e.used+'/'+e.max_attempts+(e.closes_at?' · يغلق '+dt(e.closes_at):'')+'</div></div>'+
    (soon?'<span class="bd mid">يبدأ '+dt(e.opens_at)+'</span>':'<button onclick="startExam(\''+e.id+'\','+(e.in_progress?1:0)+')">'+(e.in_progress?'كمّل الاختبار':'ابدأ الاختبار')+'</button>')+'</div></div>';
  }).join(''):'<div class="card m" style="text-align:center">لا توجد اختبارات جديدة متاحة الآن ✨</div>';
}

function pk(k){return k+'_'+(S.me?S.me.phone:'')}
function bdgs(){
  var R=allResults().slice().reverse(),P=R.map(pc),n=R.length,w=wGet().length,pr=ld(pk('pt_pr'))||0,top=false,st=S.st||{},streak=0,best=0,imp=false,i;
  Object.keys(st).forEach(function(k){if(st[k].rank<=3&&st[k].n>=5)top=true});
  P.forEach(function(x){if(x>=70){streak++;best=Math.max(best,streak)}else streak=0});
  for(i=1;i<P.length;i++)if(P[i]-P[i-1]>=10)imp=true;
  return [
    {id:'first',i:'🌱',n:'البداية',d:'حلّ أول اختبار',ok:n>=1},
    {id:'five',i:'📚',n:'مجتهد',d:'حلّ 5 اختبارات',ok:n>=5},
    {id:'ten',i:'🎓',n:'محترف',d:'حلّ 10 اختبارات',ok:n>=10},
    {id:'full',i:'💯',n:'الدرجة الكاملة',d:'احصل على 100% في اختبار',ok:P.some(function(x){return x>=100})},
    {id:'str3',i:'🔥',n:'على نار',d:'3 اختبارات ورا بعض 70% فأكتر',ok:best>=3},
    {id:'imp',i:'📈',n:'أحسن تحسّن',d:'ارفع نتيجتك 10% عن الاختبار اللي قبله',ok:imp},
    {id:'top',i:'🏅',n:'من الأوائل',d:'ترتيبك من أول 3 في اختبار',ok:top},
    {id:'v5',i:'🎬',n:'متابع شاطر',d:'شاهد 5 فيديوهات',ok:w>=5},
    {id:'v20',i:'🍿',n:'عاشق الشرح',d:'شاهد 20 فيديو',ok:w>=20},
    {id:'fix',i:'🎯',n:'بتصلّح أخطاءك',d:'خلّص تدريب على أخطائك',ok:pr>=1}];
}
function newBadges(){try{var e=bdgs().filter(function(b){return b.ok}),ids=e.map(function(b){return b.id}),old=ld(pk('pt_bd'));sv(pk('pt_bd'),ids);if(!old)return [];return e.filter(function(b){return old.indexOf(b.id)<0})}catch(x){return []}}
function badgeCard(){var B=bdgs(),k=B.filter(function(b){return b.ok}).length;return '<div class="card"><div class="row"><b>🏆 شاراتي</b><span class="bd '+(k?'hi':'mid')+'">'+k+' / '+B.length+'</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px">'+B.map(function(b){return '<div style="text-align:center;padding:10px 6px;border-radius:12px;background:'+(b.ok?'#fef9c3':'#f1f5f9')+';border:1px solid '+(b.ok?'#fde047':'#e2e8f0')+';'+(b.ok?'':'filter:grayscale(1);opacity:.65')+'"><div style="font-size:30px">'+b.i+'</div><div style="font-weight:800;font-size:13px">'+b.n+'</div><div class="m" style="font-size:11px">'+b.d+'</div></div>'}).join('')+'</div></div>'}
/* ---------- 2) الاختبارات القديمة + الإحصائيات ---------- */
function tOld(){
  var R=allResults();
  if(!R.length){$('body').innerHTML='<div class="card m" style="text-align:center">لسه ما حلّتش أي اختبار</div>';return}
  var P=R.map(pc),avg=Math.round(P.reduce(function(a,b){return a+b},0)/P.length);
  var asc=R.slice().reverse().map(pc),W=300,H=90,pts=asc.map(function(v,i){return [asc.length>1?10+i*(W-20)/(asc.length-1):W/2,H-8-v*(H-20)/100]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var trend=asc.length>1?(asc[asc.length-1]>=asc[0]?'📈 في تحسّن':'📉 محتاج مجهود'):'';
  $('body').innerHTML=badgeCard()+'<div class="card"><h3>إحصائياتي</h3><div class="st"><div><b>'+R.length+'</b>اختبار</div><div><b>'+avg+'%</b>المتوسط</div><div><b>'+Math.max.apply(0,P)+'%</b>أعلى نتيجة</div><div><b>'+Math.min.apply(0,P)+'%</b>أقل نتيجة</div></div>'+
  '<div class="m">تطور مستواي '+trend+'</div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;background:#f8fafc;border-radius:10px"><polyline fill="none" stroke="#1e40af" stroke-width="2.5" points="'+line+'"/>'+pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#1e40af"/>'}).join('')+'</svg></div>'+
  R.map(function(r){var s=(S.st||{})[r.exam_id],mine=pc(r),cmp='',nt=(S.nt||{})[r.exam_id]?'<div class="ex" style="background:#fef3c7">📝 <b>ملاحظة المدرس:</b> '+esc(S.nt[r.exam_id])+'</div>':'';
    if(s){var d=mine-s.avg;cmp='<div class="m" style="margin-top:6px">🏅 ترتيبك <b>'+s.rank+'</b> من '+s.n+' · متوسط الدفعة <b>'+fm(s.avg)+'%</b> · أعلى درجة <b>'+fm(s.top)+'</b> '+(d>=0?'<span class="bd hi">فوق المتوسط</span>':'<span class="bd lo">تحت المتوسط</span>')+'</div>'}
    return '<div class="card"><div class="row"><div><b>'+esc(r.title)+'</b><div class="m">'+dt(r.at)+' · '+fm(r.score)+' من '+r.total+'</div></div><div class="row">'+bd(mine)+(r.review?'<button class="g" onclick="review(\''+r.exam_id+'\')">مراجعة</button>':'')+'</div></div>'+cmp+nt+'</div>'}).join('');

function eimgs(v){if(!v)return [];v=String(v).trim();if(v.charAt(0)==='['){try{return JSON.parse(v).filter(Boolean)}catch(e){}}return [v]}
function convOld(r){var qs=r.questions||[],an=r.answers||{},K='abcd';return {title:r.title,score:r.score,total:r.total,items:qs.map(function(q,i){var c=q.correct!==undefined?Number(q.correct):Number(q.correctIndex),a=an[q.id];if(a===undefined)a=an[i];var has=!(a===undefined||a===null||a==='');return {old:1,text:q.text||'',img:q.image||q.img||'',opts:q.options||[],correct:isNaN(c)?'':K.charAt(c),mine:(has&&!isNaN(Number(a)))?K.charAt(Number(a)):'',exp:q.explanation||q.exp||'',exp_img:q.explanationImage||q.expImg||'',topic:q.topic||q.topicName||null}})}}
function getRev(id){var p=id.indexOf('old:')===0?rpc('portal_old_review',{p_phone:S.me.phone,p_code:S.me.code,p_pub:id.slice(4)}).then(function(r){return r.error?r:convOld(r)}):rpc('exam_review',{p_exam:id,p_phone:S.me.phone,p_code:S.me.code});return S.rev[id]?Promise.resolve(S.rev[id]):p.then(function(r){if(!r.error)S.rev[id]=r;return r})}
function qBody(it){return (it.text?'<div style="font-weight:700;margin:6px 0">'+esc(it.text)+'</div>':'')+(it.img?'<img src="'+img(it.img)+'" loading="lazy" decoding="async">':'')}
function oldOpts(it){return (it.opts||[]).map(function(t,oi){var k='abcd'.charAt(oi),isC=k===it.correct,isM=k===it.mine,st=isC?'background:#dcfce7;border-color:#16a34a':isM?'background:#fee2e2;border-color:#dc2626':'';return '<div style="border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;margin-top:5px;'+st+'"><b>'+L[k]+')</b> '+esc(t)+(isC?' <span class="m">✔ الصحيحة</span>':'')+(isM&&!isC?' <span class="m">❌ إجابتك</span>':'')+(isM&&isC?' <span class="m">✅ إجابتك</span>':'')+'</div>'}).join('')+(it.mine?'':'<div class="m" style="margin-top:4px">لم تُجب</div>')}

  }).catch(function(){alert('تعذر فتح الاختبار، تأكد من النت وجرّب تاني');load().catch(function(){})});
}
